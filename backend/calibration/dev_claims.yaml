# Hand-labelled claims used to tune the confidence thresholds and weights.
# Labels follow Veritrace's definitions, judged only against the two sample documents:
#   high          a passage states the claim
#   inferred      no passage states it, but it follows from the passages without outside
#                 knowledge (arithmetic on dates, combining facts, cause and effect)
#   hallucinated  contradicted by the passages, or not supported by them at all
#                 (even if it happens to be true in the real world)
# Each claim comes with the question it answers, used for retrieval and resampling.

claims:
  # ---------------- Chandrayaan-3 ----------------
  - {question: "When was Chandrayaan-3 launched?", claim: "Chandrayaan-3 was launched on 14 July 2023.", label: high}
  - {question: "Which rocket launched Chandrayaan-3?", claim: "Chandrayaan-3 was launched aboard an LVM3 rocket.", label: high}
  - {question: "When did the Vikram lander land?", claim: "The Vikram lander touched down near the lunar south pole on 23 August 2023.", label: high}
  - {question: "What did the Pragyan rover find?", claim: "The LIBS instrument on the Pragyan rover confirmed sulphur near the lunar south pole.", label: high}
  - {question: "How far did the Pragyan rover travel?", claim: "The Pragyan rover travelled about 100 metres across the surface.", label: high}
  - {question: "How long were the lander and rover designed to work?", claim: "The lander and rover were designed to operate for about one lunar day.", label: high}
  - {question: "What was the landing site named?", claim: "The landing site was named the Shiv Shakti point.", label: high}

  - {question: "How long did Chandrayaan-3 take to reach the Moon?", claim: "Chandrayaan-3 reached lunar orbit about three weeks after launch.", label: inferred}
  - {question: "How long did the Pragyan rover work on the Moon?", claim: "The Pragyan rover worked on the Moon for roughly two weeks.", label: inferred}
  - {question: "Why did the Chandrayaan-3 surface mission end?", claim: "The lander and rover stopped working because they did not survive the lunar night.", label: inferred}
  - {question: "How did Chandrayaan-3 compare with Chandrayaan-2?", claim: "Chandrayaan-3's landing was more successful than Chandrayaan-2's landing.", label: inferred}
  - {question: "When did the hop experiment happen?", claim: "The hop experiment took place 11 days after the landing.", label: inferred}
  - {question: "How long was Chandrayaan-3 in lunar orbit before the lander separated?", claim: "Chandrayaan-3 spent about 12 days in lunar orbit before the lander separated.", label: inferred}

  - {question: "When was Chandrayaan-3 launched?", claim: "Chandrayaan-3 was launched on 14 August 2023.", label: hallucinated}
  - {question: "Which rocket launched Chandrayaan-3?", claim: "Chandrayaan-3 was launched aboard a PSLV rocket.", label: hallucinated}
  - {question: "What did the Pragyan rover find?", claim: "The Pragyan rover detected water ice inside a nearby crater.", label: hallucinated}
  - {question: "How far did the Pragyan rover travel?", claim: "The Pragyan rover travelled about 500 metres across the surface.", label: hallucinated}
  - {question: "What did Chandrayaan-3 carry?", claim: "Chandrayaan-3 carried an orbiter, a lander and a rover.", label: hallucinated}
  - {question: "What happened after the lunar night?", claim: "The lander and rover woke up successfully after the lunar night.", label: hallucinated}
  - {question: "What comes after Chandrayaan-3?", claim: "ISRO plans to launch Chandrayaan-4 to collect lunar samples.", label: hallucinated}
  - {question: "What does the rover's finding mean?", claim: "The south polar soil has a different composition from regions studied before.", label: hallucinated}

  # ---------------- James Webb Space Telescope ----------------
