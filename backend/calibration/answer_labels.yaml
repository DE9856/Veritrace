# Hand labels for the claims collect_answers.py extracted from real answers
# (answer_signals.json), keyed by the claim's exact text. Same definitions as
# dev_claims.yaml, judged only against the two sample documents:
#   high          a passage states the claim (paraphrases count)
#   inferred      no passage states it, but it follows from the passages
#   hallucinated  contradicted by the passages, or not supported by them

