# A second held-out set, written in 0.9.0 after the test set had been used to find the
# novelty rule's errors (so test no longer measures it cleanly). Never used for tuning or
# for designing a rule. Same label definitions as dev_claims.yaml; most "high" claims are
# paraphrases, as a hosted model writes them.

claims:
  # ---------------- Chandrayaan-3 ----------------
  - {question: "What happened to Chandrayaan-2's lander?", claim: "Chandrayaan-2's lander, also called Vikram, crashed in September 2019.", label: high}
  - {question: "When was Chandrayaan-3 launched?", claim: "ISRO sent Chandrayaan-3 into space on 14 July 2023.", label: high}
  - {question: "Where did Vikram land?", claim: "Vikram set down close to the Moon's south pole.", label: high}
  - {question: "What was special about the landing?", claim: "India was the first nation to land close to the lunar south pole.", label: high}
  - {question: "What did the LIBS instrument find?", claim: "The rover's laser spectroscope found sulphur in the lunar soil near the south pole.", label: high}
  - {question: "What else did LIBS detect?", claim: "Besides sulphur, LIBS picked up iron, calcium and aluminium.", label: high}
  - {question: "What did the hop experiment involve?", claim: "In the hop test, Vikram fired its engines, rose about 40 centimetres and came down 30 to 40 centimetres away.", label: high}

  - {question: "How long did Chandrayaan-3 take to reach lunar orbit?", claim: "Chandrayaan-3 needed 22 days to get from launch to lunar orbit.", label: inferred}
  - {question: "Where was the propulsion module in 2024?", claim: "By 2024 the propulsion module was no longer orbiting the Moon.", label: inferred}
  - {question: "How long after landing did the hop happen?", claim: "The hop came about a week and a half after touchdown.", label: inferred}
  - {question: "How did Chandrayaan-3 compare with Chandrayaan-2?", claim: "Chandrayaan-3's lander landed safely, unlike Chandrayaan-2's.", label: inferred}
  - {question: "Did the rover work beyond its design life?", claim: "The rover did not keep working beyond its planned single lunar day.", label: inferred}

  - {question: "Who built Chandrayaan-3?", claim: "Chandrayaan-3 was built jointly by ISRO and NASA.", label: hallucinated}
  - {question: "Where did Vikram land?", claim: "Vikram set down close to the Moon's north pole.", label: hallucinated}
  - {question: "How far did the rover travel?", claim: "Pragyan drove roughly 1 kilometre over the lunar surface.", label: hallucinated}
  - {question: "What did the LIBS instrument find?", claim: "LIBS found no sulphur near the south pole.", label: hallucinated}
  - {question: "What was the landing site named?", claim: "The landing site was named the Vikram Sarabhai point.", label: hallucinated}
  - {question: "What happened to the propulsion module?", claim: "In November 2023 the propulsion module crashed onto the Moon.", label: hallucinated}

  # ---------------- James Webb Space Telescope ----------------
  - {question: "Who developed JWST?", claim: "NASA built JWST in partnership with ESA and CSA.", label: high}
  - {question: "When did JWST reach L2?", claim: "Webb arrived at L2 on 24 January 2022.", label: high}
  - {question: "What is the mirror made of?", claim: "The main mirror consists of 18 six-sided beryllium segments covered in gold.", label: high}
  - {question: "How many layers does the sunshield have?", claim: "The sunshield is made up of five layers.", label: high}
  - {question: "Which instrument needs the cryocooler?", claim: "MIRI needs to be colder than JWST's other instruments.", label: high}
  - {question: "When was the first image shown?", claim: "The First Deep Field image was unveiled on 11 July 2022.", label: high}
  - {question: "Who was James E. Webb?", claim: "James E. Webb was in charge of NASA from 1961 to 1968.", label: high}

  - {question: "How long did JWST take to reach L2?", claim: "JWST took about 30 days to get to L2.", label: inferred}
  - {question: "Which JWST instrument is not near-infrared?", claim: "MIRI is the only JWST instrument that is not a near-infrared instrument.", label: inferred}
  - {question: "When were the remaining first images released?", claim: "The rest of the first images came out the day after the First Deep Field.", label: inferred}
  - {question: "Did Webb lead NASA in the 1970s?", claim: "James E. Webb had stopped leading NASA by 1970.", label: inferred}
  - {question: "Was the mirror open during launch?", claim: "The mirror was not fully open during the launch.", label: inferred}

  - {question: "When was JWST launched?", claim: "JWST was launched on Christmas Day 2020.", label: hallucinated}
  - {question: "How far is L2 from Earth?", claim: "L2 lies roughly 15 million kilometres from Earth.", label: hallucinated}
  - {question: "What is the mirror made of?", claim: "The main mirror consists of 18 six-sided aluminium segments.", label: hallucinated}
  - {question: "Which instrument needs the cryocooler?", claim: "NIRCam needs to be colder than JWST's other instruments.", label: hallucinated}
  - {question: "What did the first image show?", claim: "Webb's First Deep Field showed the Andromeda galaxy.", label: hallucinated}
  - {question: "Who was James E. Webb?", claim: "James E. Webb was an astronomer who discovered distant galaxies.", label: hallucinated}
