<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Confidence against reality">

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
        --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; font-family: system-ui, -apple-system,
        "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
          --axis:#383835; --s1:#3987e5; --s2:#d95926; }
  }
  .bg { fill: var(--surface); } .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; } .ref { stroke: var(--muted); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; } .label { fill: var(--ink2); font-size: 12px; }
  .s1 { stroke: var(--s1); } .s2 { stroke: var(--s2); }
  .d1 { fill: var(--s1); } .d2 { fill: var(--s2); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>

<rect class="bg" width="640" height="420" rx="8"/>
<text class="title" x="56" y="26">Confidence against reality</text>
<text class="sub" x="56" y="44">Fresh set, 37 claims; each point is a bin</text>
<line class="grid" x1="56" x2="490" y1="372.0" y2="372.0"/>
<text class="tick" x="48" y="376.0" text-anchor="end">0%</text>
<text class="tick" x="56.0" y="390" text-anchor="middle">0%</text>
<line class="grid" x1="56" x2="490" y1="310.4" y2="310.4"/>
<text class="tick" x="48" y="314.4" text-anchor="end">20%</text>
<text class="tick" x="142.8" y="390" text-anchor="middle">20%</text>
<line class="grid" x1="56" x2="490" y1="248.8" y2="248.8"/>
<text class="tick" x="48" y="252.8" text-anchor="end">40%</text>
<text class="tick" x="229.6" y="390" text-anchor="middle">40%</text>
<line class="grid" x1="56" x2="490" y1="187.2" y2="187.2"/>
<text class="tick" x="48" y="191.2" text-anchor="end">60%</text>
<text class="tick" x="316.4" y="390" text-anchor="middle">60%</text>
<line class="grid" x1="56" x2="490" y1="125.6" y2="125.6"/>
<text class="tick" x="48" y="129.6" text-anchor="end">80%</text>
<text class="tick" x="403.2" y="390" text-anchor="middle">80%</text>
<line class="grid" x1="56" x2="490" y1="64.0" y2="64.0"/>
<text class="tick" x="48" y="68.0" text-anchor="end">100%</text>
<text class="tick" x="490.0" y="390" text-anchor="middle">100%</text>
<line class="axis" x1="56" x2="490" y1="372" y2="372"/>
<text class="label" x="273.0" y="410" text-anchor="middle">Stated confidence</text>
<text class="label" transform="translate(16 218.0) rotate(-90)" text-anchor="middle">Claims supported</text>
<line class="ref" x1="56" y1="372.0" x2="490" y2="64.0"/>
<text class="tick" x="476.97999999999996" y="91.24000000000001" text-anchor="end">perfect calibration</text>
<polyline class="line s1" points="70.7,328.0 258.2,64.0 382.5,64.0 459.3,64.0"/>
<circle class="dot d1" cx="70.7" cy="328.0" r="5"><title>Raw score: 14 claims scored 0.0-0.2, mean confidence 3%, 14% supported</title></circle>
<circle class="dot d1" cx="258.2" cy="64.0" r="5"><title>Raw score: 2 claims scored 0.4-0.6, mean confidence 47%, 100% supported</title></circle>
<circle class="dot d1" cx="382.5" cy="64.0" r="5"><title>Raw score: 9 claims scored 0.6-0.8, mean confidence 75%, 100% supported</title></circle>
<circle class="dot d1" cx="459.3" cy="64.0" r="5"><title>Raw score: 12 claims scored 0.8-1.0, mean confidence 93%, 100% supported</title></circle>
<circle class="d1" cx="508" cy="72" r="5"/><text class="label" x="520" y="76">Raw score</text>
<polyline class="line s2" points="113.4,348.3 147.7,64.0 359.7,64.0 471.8,64.0"/>
<circle class="dot d2" cx="113.4" cy="348.3" r="5"><title>Calibrated: 13 claims scored 0.0-0.2, mean confidence 13%, 8% supported</title></circle>
<circle class="dot d2" cx="147.7" cy="64.0" r="5"><title>Calibrated: 1 claims scored 0.2-0.4, mean confidence 21%, 100% supported</title></circle>
<circle class="dot d2" cx="359.7" cy="64.0" r="5"><title>Calibrated: 2 claims scored 0.6-0.8, mean confidence 70%, 100% supported</title></circle>
<circle class="dot d2" cx="471.8" cy="64.0" r="5"><title>Calibrated: 21 claims scored 0.8-1.0, mean confidence 96%, 100% supported</title></circle>
<circle class="d2" cx="508" cy="94" r="5"/><text class="label" x="520" y="98">Calibrated</text>
</svg>
